name: Update welding news

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Collect public news and rebuild index pages
        id: collect
        run: node scripts/update-news.mjs
      - name: Build the public site package
        run: node scripts/build-site.mjs
      - name: Publish updated content to the repository
        if: steps.collect.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html news.json news/ robots.txt sitemap.xml
          if git diff --cached --quiet; then
            echo "No new articles to publish."
            exit 0
          fi
          git commit -m "Update welding news"
          git push
      - name: Set up GitHub Pages
        if: steps.collect.outputs.changed == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload updated site
        if: steps.collect.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy updated site
        if: steps.collect.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
